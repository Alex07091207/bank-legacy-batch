version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_DATABASE: bank_batch
      MYSQL_ROOT_PASSWORD: liliyasir1207#
    ports:
      - "3307:3306"
    networks:
      - bank-network

  zookeeper:
    image: wurstmeister/zookeeper
    ports:
      - "2181:2181"
    networks:
      - bank-network

  kafka:
    image: wurstmeister/kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_HOST_NAME: kafka
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    depends_on:
      - zookeeper
    networks:
      - bank-network

  config-server:
    build:
      context: ./config_server/config_server
    container_name: config-server
    ports:
      - "8888:8888"
    networks:
      - bank-network

  eureka-server:
    build:
      context: ./eureka_server/eureka_server
    container_name: eureka-server
    ports:
      - "8761:8761"
    depends_on:
      - config-server
    networks:
      - bank-network

  bank-legacy-batch:
    build:
      context: ./bank-legacy-batch
    container_name: bank-legacy-batch
    ports:
      - "8443:8443"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/bank_batch?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=liliyasir1207#
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - mysql-db
      - config-server
      - eureka-server
      - kafka
    networks:
      - bank-network

networks:
  bank-network:
    driver: bridge